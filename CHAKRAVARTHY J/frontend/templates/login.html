<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Textile Waste Intelligence Platform — Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand">
        <div class="icon">🧵</div>
        <h2>Textile Waste Intelligence</h2>
        <div class="sub">Sign in to access the platform</div>
      </div>

      <div class="error-banner" id="error-banner"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="identifier">Username or Email</label>
          <input type="text" id="identifier" placeholder="admin" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Sign In</button>
      </form>

      <div class="demo-creds">
        <strong>Demo accounts (seeded on first run):</strong><br />
        Admin — username: <code>admin</code> / password: <code>Admin@123</code><br />
        Staff — username: <code>staff1</code> / password: <code>Staff@123</code>
      </div>

      <p class="muted" style="text-align:center; margin-top:16px;">
        Don't have an account? <a href="#" id="show-register">Register as Viewer</a>
      </p>
    </div>
  </div>

  <!-- Register modal -->
  <div class="modal-overlay" id="register-modal">
    <div class="modal-box">
      <h3>Create Viewer Account</h3>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="reg-username" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" />
      </div>
      <div class="form-group">
        <label>Password (min 6 characters)</label>
        <input type="password" id="reg-password" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancel-register">Cancel</button>
        <button class="btn btn-primary" id="submit-register">Create Account</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  <script>
    // If already logged in, skip straight to dashboard.
    if (getToken()) {
      window.location.href = "/dashboard";
    }

    const errorBanner = document.getElementById("error-banner");

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.style.display = "block";
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBanner.style.display = "none";
      const identifier = document.getElementById("identifier").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("login-btn");
      btn.disabled = true;
      btn.textContent = "Signing in...";

      try {
        const data = await apiFetch("/auth/login", {
          method: "POST",
          body: JSON.stringify({ username: identifier, password }),
        });
        setSession(data.token, data.user);
        window.location.href = "/dashboard";
      } catch (err) {
        showError(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign In";
      }
    });

    const regModal = document.getElementById("register-modal");
    document.getElementById("show-register").addEventListener("click", (e) => {
      e.preventDefault();
      regModal.classList.add("show");
    });
    document.getElementById("cancel-register").addEventListener("click", () => {
      regModal.classList.remove("show");
    });

    document.getElementById("submit-register").addEventListener("click", async () => {
      const username = document.getElementById("reg-username").value.trim();
      const email = document.getElementById("reg-email").value.trim();
      const password = document.getElementById("reg-password").value;

      try {
        const data = await apiFetch("/auth/register", {
          method: "POST",
          body: JSON.stringify({ username, email, password }),
        });
        setSession(data.token, data.user);
        window.location.href = "/dashboard";
      } catch (err) {
        alert(err.message);
      }
    });
  </script>
</body>
</html>
