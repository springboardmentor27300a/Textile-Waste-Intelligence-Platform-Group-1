<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports & Export — Textile Waste Intelligence Platform</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="app-shell">
    {% include "_sidebar.html" %}

    <div class="main">
      <div class="topbar">
        <div>
          <h2>Reports &amp; Export</h2>
        </div>
        <div style="display:flex; align-items:center; gap:14px;">
          <div class="user-badge" id="user-badge"></div>
          <button class="btn btn-secondary" onclick="logout()">Logout</button>
        </div>
      </div>

      <div class="grid grid-2" id="report-grid"></div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  <script>
    requireAuth();
    renderUserBadge("user-badge");

    async function downloadReport(reportId, format) {
      const btn = document.getElementById(`btn-${reportId}-${format}`);
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = "Preparing...";
      try {
        const res = await fetch(`/api/reports/${reportId}/${format}`, {
          headers: { Authorization: "Bearer " + getToken() },
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.error || "Report generation failed");
        }
        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${reportId}-report.${format === "excel" ? "xlsx" : "pdf"}`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);
        showToast("Report downloaded");
      } catch (err) {
        showToast(err.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = original;
      }
    }

    async function loadReportCatalog() {
      try {
        const data = await apiFetch("/reports/");
        const grid = document.getElementById("report-grid");
        grid.innerHTML = data.reports.map(r => `
          <div class="card report-card">
            <div class="report-card-icon">${r.icon}</div>
            <div class="section-title" style="margin-bottom:6px;">${r.title}</div>
            <div class="muted mb-16">${r.description}</div>
            <div class="flex-between">
              <button class="btn btn-primary" id="btn-${r.id}-pdf" onclick="downloadReport('${r.id}', 'pdf')">📄 PDF</button>
              <button class="btn btn-secondary" id="btn-${r.id}-excel" onclick="downloadReport('${r.id}', 'excel')">📊 Excel</button>
            </div>
          </div>
        `).join("");
      } catch (err) {
        showToast(err.message, true);
      }
    }

    loadReportCatalog();
  </script>
</body>
</html>
