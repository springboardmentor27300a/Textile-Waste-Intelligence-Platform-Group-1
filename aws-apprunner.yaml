version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install -r backend/requirements.txt
run:
  command: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
  network:
    port: 8000
    env:
      - name: PORT
        value: "8000"
      # The DATABASE_URL and SECRET_KEY should be set in the AWS Console for security.
