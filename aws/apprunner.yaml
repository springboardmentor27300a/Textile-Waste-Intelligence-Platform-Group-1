version: 1.0
runtime: python311
build:
  commands:
    pre-build:
      - pip install --upgrade pip
    build:
      - cd backend && pip install -r requirements.txt
run:
  runtime-version: 3.11
  command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  network:
    port: 8000
    env: APP_PORT
  env:
    - name: ENVIRONMENT
      value: production
    - name: DATABASE_URL
      value: sqlite:///./textile_waste.db
    - name: JWT_SECRET_KEY
      value: textile-intelligence-apprunner-secret-key-2026
