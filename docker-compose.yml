services:

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: textile_waste_db
      POSTGRES_USER: textile_user
      POSTGRES_PASSWORD: textile_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: Textile Waste Intelligence Platform
      APP_VERSION: 1.0.0
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: textile_waste_db
      DB_USER: textile_user
      DB_PASSWORD: textile_password
      JWT_SECRET_KEY: change-this-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CORS_ORIGINS: http://localhost
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
