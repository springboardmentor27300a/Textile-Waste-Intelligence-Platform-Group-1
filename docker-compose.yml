version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: twip-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./textile_waste.db
      - SECRET_KEY=${SECRET_KEY:-textile-waste-super-secret-jwt-key-change-in-production-2024}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - APP_NAME=Textile Waste Intelligence Platform
      - APP_VERSION=1.0.0
    volumes:
      - ./backend/textile_waste.db:/app/textile_waste.db
      - ./backend/app/uploads:/app/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: twip-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
