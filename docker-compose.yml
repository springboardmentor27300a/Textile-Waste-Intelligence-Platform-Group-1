version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: weavecycle_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: weavecycle
    ports:
      - "5433:5432" # Maps to 5433 on the host to avoid conflicting with your host system's running Postgres on 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weavecycle_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/weavecycle
      - SECRET_KEY=weavecycle_super_secret_key_change_me_in_production
      - ALGORITHM=HS256
      - UPLOAD_DIR=/workspace/uploads
    volumes:
      - ./backend/uploads:/workspace/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: weavecycle_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://13.51.163.81:8000/api/v1
    stdin_open: true
    tty: true

volumes:
  postgres_data:
