services:

  backend:
    build: ./backend
    container_name: textile_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:password%40123@db:5432/textile_db
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: textile_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password@123
      POSTGRES_DB: textile_db
    ports:
      - "5432:5432"

  frontend:
    build: ./frontend
    container_name: textile_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend