<svg viewBox="0 0 1000 780" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, sans-serif">
  <rect width="1000" height="780" fill="#F4F4F4" />
  <text x="24" y="30" font-size="16" font-weight="600" fill="#222">Reloom — Low-fidelity wireframes (Milestone 1 screens)</text>

  <!-- Panel 1: Login -->
  <g transform="translate(24,50)">
    <rect width="460" height="330" fill="#fff" stroke="#999" stroke-width="1.5"/>
    <text x="10" y="20" font-size="12" fill="#666">1. Sign in</text>
    <rect x="140" y="60" width="180" height="16" fill="#ccc"/>
    <rect x="150" y="100" width="160" height="70" fill="#eee" stroke="#bbb"/>
    <rect x="160" y="115" width="60" height="8" fill="#bbb"/>
    <rect x="160" y="130" width="140" height="16" fill="#ddd"/>
    <rect x="160" y="150" width="60" height="8" fill="#bbb"/>
    <rect x="160" y="165" width="140" height="16" fill="#ddd" opacity="0"/>
    <rect x="150" y="185" width="160" height="16" fill="#ddd"/>
    <rect x="150" y="210" width="160" height="26" fill="#999"/>
    <text x="200" y="228" font-size="9" fill="#fff" text-anchor="middle">Sign in</text>
  </g>

  <!-- Panel 2: Register batch -->
  <g transform="translate(516,50)">
    <rect width="460" height="330" fill="#fff" stroke="#999" stroke-width="1.5"/>
    <text x="10" y="20" font-size="12" fill="#666">2. Register batch (form)</text>
    <rect x="20" y="40" width="200" height="10" fill="#ccc"/>
    <rect x="20" y="60" width="420" height="1" fill="#ddd"/>
    <rect x="20" y="80" width="190" height="30" fill="#eee" stroke="#bbb"/>
    <rect x="230" y="80" width="190" height="30" fill="#eee" stroke="#bbb"/>
    <text x="26" y="75" font-size="8" fill="#888">Fabric type</text>
    <text x="236" y="75" font-size="8" fill="#888">Source type</text>
    <rect x="20" y="130" width="400" height="30" fill="#eee" stroke="#bbb"/>
    <text x="26" y="125" font-size="8" fill="#888">Source</text>
    <rect x="20" y="180" width="125" height="30" fill="#eee" stroke="#bbb"/>
    <rect x="155" y="180" width="125" height="30" fill="#eee" stroke="#bbb"/>
    <rect x="290" y="180" width="130" height="30" fill="#eee" stroke="#bbb"/>
    <text x="26" y="175" font-size="8" fill="#888">Quantity</text>
    <text x="161" y="175" font-size="8" fill="#888">Color</text>
    <text x="296" y="175" font-size="8" fill="#888">Condition</text>
    <rect x="20" y="230" width="400" height="26" fill="#dfe" stroke="#9c9"/>
    <text x="26" y="248" font-size="8" fill="#575">real dataset reference figure shown here</text>
    <rect x="20" y="280" width="400" height="30" fill="#999"/>
    <text x="220" y="299" font-size="9" fill="#fff" text-anchor="middle">Register batch</text>
  </g>

  <!-- Panel 3: Waste batches list -->
  <g transform="translate(24,400)">
    <rect width="460" height="330" fill="#fff" stroke="#999" stroke-width="1.5"/>
    <text x="10" y="20" font-size="12" fill="#666">3. Waste batches (list + filters)</text>
    <rect x="20" y="35" width="150" height="12" fill="#ccc"/>
    <rect x="380" y="30" width="60" height="24" fill="#999"/>
    <rect x="20" y="60" width="420" height="24" fill="#eee" stroke="#bbb"/>
    <rect x="20" y="95" width="200" height="18" fill="#eee" stroke="#bbb"/>
    <rect x="230" y="95" width="90" height="18" fill="#eee" stroke="#bbb"/>
    <g>
      <rect x="20" y="125" width="420" height="40" fill="#f6f6f6" stroke="#ddd"/>
      <rect x="20" y="170" width="420" height="40" fill="#f6f6f6" stroke="#ddd"/>
      <rect x="20" y="215" width="420" height="40" fill="#f6f6f6" stroke="#ddd"/>
      <rect x="20" y="260" width="420" height="40" fill="#f6f6f6" stroke="#ddd"/>
      <circle cx="34" cy="145" r="5" fill="#bbb"/>
      <circle cx="34" cy="190" r="5" fill="#bbb"/>
      <circle cx="34" cy="235" r="5" fill="#bbb"/>
      <circle cx="34" cy="280" r="5" fill="#bbb"/>
      <rect x="50" y="135" width="80" height="8" fill="#ccc"/>
      <rect x="50" y="150" width="180" height="6" fill="#ddd"/>
      <rect x="50" y="180" width="80" height="8" fill="#ccc"/>
      <rect x="50" y="195" width="180" height="6" fill="#ddd"/>
      <rect x="50" y="225" width="80" height="8" fill="#ccc"/>
      <rect x="50" y="240" width="180" height="6" fill="#ddd"/>
      <rect x="50" y="270" width="80" height="8" fill="#ccc"/>
      <rect x="50" y="285" width="180" height="6" fill="#ddd"/>
    </g>
  </g>

  <!-- Panel 4: Dashboard -->
  <g transform="translate(516,400)">
    <rect width="460" height="330" fill="#fff" stroke="#999" stroke-width="1.5"/>
    <text x="10" y="20" font-size="12" fill="#666">4. Overview dashboard</text>
    <rect x="20" y="35" width="95" height="55" fill="#eee" stroke="#bbb"/>
    <rect x="125" y="35" width="95" height="55" fill="#eee" stroke="#bbb"/>
    <rect x="230" y="35" width="95" height="55" fill="#eee" stroke="#bbb"/>
    <rect x="335" y="35" width="95" height="55" fill="#eee" stroke="#bbb"/>
    <rect x="20" y="105" width="260" height="200" fill="#f6f6f6" stroke="#ddd"/>
    <text x="30" y="122" font-size="9" fill="#888">Batches by fabric type (bar chart)</text>
    <rect x="40" y="220" width="20" height="70" fill="#bbb"/>
    <rect x="70" y="200" width="20" height="90" fill="#bbb"/>
    <rect x="100" y="240" width="20" height="50" fill="#bbb"/>
    <rect x="130" y="180" width="20" height="110" fill="#bbb"/>
    <rect x="160" y="230" width="20" height="60" fill="#bbb"/>
    <rect x="290" y="105" width="150" height="200" fill="#f6f6f6" stroke="#ddd"/>
    <text x="298" y="122" font-size="9" fill="#888">Recently registered</text>
    <rect x="298" y="135" width="134" height="30" fill="#eee" stroke="#ddd"/>
    <rect x="298" y="170" width="134" height="30" fill="#eee" stroke="#ddd"/>
    <rect x="298" y="205" width="134" height="30" fill="#eee" stroke="#ddd"/>
  </g>

  <text x="24" y="750" font-size="10" fill="#888">Low fidelity by design - box/label placement only, no color or copy decisions made at this stage.</text>
</svg>
