services:
  - type: web
    name: ai-textile-waste-intelligence-platform
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: twip-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: ai-textile-waste-frontend
    env: static
    buildCommand: ""
    staticPublishPath: ./frontend

databases:
  - name: twip-db
    plan: free
    databaseName: twip
    user: twip_user
