version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: twip_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password_2026
      POSTGRES_DB: textile_waste_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: twip_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_secure_password_2026@db:5432/textile_waste_db
      - PORT=8000
      - JWT_SECRET=textile_waste_secret_jwt_key_2026_safe
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: twip_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
